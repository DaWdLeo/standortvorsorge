name: V3 Arbeitsstand Pilot Browser QA
on:
  pull_request:
    paths:
      - "assistent-v3/**"
      - ".github/workflows/v3-arbeitsstand-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser for UI smoke tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check scripts and start local Pages server
        run: |
          for file in assistent-v3/assets/js/*.js assistent-v3/tests/*.cjs; do node --check "$file"; done
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v3-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/assistent-v3/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-http.log
          exit 1
      - name: Test independent case-status dashboard
        run: node --test assistent-v3/tests/v3-workstand.test.cjs
