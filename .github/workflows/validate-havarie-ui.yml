name: Validate Havarie UI
on:
  pull_request:
    paths:
      - "assistent-v2/**"
      - "assistent/**"
      - ".github/workflows/validate-havarie-ui.yml"
  push:
    branches:
      - ui-havarie-navigation-20261014
      - modern-industrial-ui-20261014
      - fix-unit-layout-print-report-20261014
    paths:
      - "assistent-v2/**"
      - "assistent/**"
      - ".github/workflows/validate-havarie-ui.yml"
permissions:
  contents: read
jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in assistent-v2/assets/js/*.js assistent-v2/data/regelwerk.js assistent-v2/embed.js assistent/app.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - name: Verify status, navigation and static demo boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('assistent-v2/index.html').read_text(encoding='utf-8')
          app = Path('assistent-v2/assets/js/app.js').read_text(encoding='utf-8')
          css = Path('assistent-v2/assets/css/app.css').read_text(encoding='utf-8')
          home = Path('assistent-v2/assets/js/views-main.js').read_text(encoding='utf-8')
          legacy = Path('assistent/index.html').read_text(encoding='utf-8')
          assert 'id="status-dock"' in page
          assert 'dock__navigation' in app and "A.actions['nav-toggle']" in app
          assert '.status-dock {' in css and 'position: sticky' in css
          assert 'overflow-wrap: anywhere' in css
          assert 'ISO 14001' in home and 'Keine geprüfte Notfallanweisung' in home
          assert 'Demo · nicht freigegeben' in app
          assert 'legacy-release-tile' in legacy
          assert 'data/regelwerk.js' in page
          industrial = Path('assistent-v2/assets/js/industrial.js').read_text(encoding='utf-8')
          design = Path('assistent-v2/assets/css/industrial.css').read_text(encoding='utf-8')
          assert 'industrial.js' in page and 'industrial.css' in page
          for area in ('Übersicht', 'Standort', 'Gefahrstoffe', 'Vorsorge', 'Notfallplan'):
              assert area in page
          assert "A.views.notfall" in industrial and 'Keine freigegebenen Einsatzunterlagen' in industrial
          assert 'A.views.start' in industrial and 'fachliche prüfung' in industrial.lower()
          assert '.industrial-bottom-nav' in design and '.industrial-sidebar' in design
          assert 'position:fixed' in design and '100dvh' in design
          assert 'window.HavarieEngine' not in industrial
          result = Path('assistent-v2/assets/js/views-result.js').read_text(encoding='utf-8')
          form = Path('assistent-v2/assets/js/views-main.js').read_text(encoding='utf-8')
          printed = Path('assistent-v2/assets/css/report.css').read_text(encoding='utf-8')
          assert 'reportSheet(res, v, rs)' in result and 'report-sheet' in result
          assert 'ENTWURF' in result and 'FACHLICH NICHT' in result
          assert 'unit-picker' in form and '.unit-picker .chips' in printed
          assert '@media print' in printed and 'A4 portrait' in printed
          assert 'assets/css/report.css' in page

          print('UI checks passed')
          PY
